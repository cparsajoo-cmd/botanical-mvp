name: Backfill Canonical Assertions

# Manual only. Dry-run reads Supabase and calls OpenAI but writes nothing.
# Apply mode can write only to llm_result_direction / llm_safety_signal and
# requires an explicit confirmation phrase.
"on":
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (no writes) or apply (writes LLM provenance fields)"
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      limit:
        description: "Maximum number of evidence records to process"
        required: true
        type: string
        default: "100"
      confirm_apply:
        description: "For apply only: type exactly APPLY CANONICAL ASSERTIONS"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode }}
      LIMIT: ${{ inputs.limit }}
      CONFIRM_APPLY: ${{ inputs.confirm_apply }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate inputs and secrets
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::limit must be a positive integer."
            exit 1
          fi

          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing GitHub Actions secret: OPENAI_API_KEY"
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret: SUPABASE_URL"
            exit 1
          fi
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Missing GitHub Actions secret: SUPABASE_KEY"
            exit 1
          fi

          if [ "$MODE" = "apply" ] && [ "$CONFIRM_APPLY" != "APPLY CANONICAL ASSERTIONS" ]; then
            echo "::error::Apply mode requires confirm_apply to equal exactly: APPLY CANONICAL ASSERTIONS"
            exit 1
          fi

      - name: Run canonical assertion backfill (dry-run)
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          set -euo pipefail
          python backfill_canonical_assertions.py --limit "$LIMIT" | tee backfill_output.log

      - name: Run canonical assertion backfill (apply)
        if: ${{ inputs.mode == 'apply' && inputs.confirm_apply == 'APPLY CANONICAL ASSERTIONS' }}
        run: |
          set -euo pipefail
          python backfill_canonical_assertions.py --apply --limit "$LIMIT" | tee backfill_output.log

      - name: Print summary
        if: always()
        run: |
          if [ -f backfill_output.log ]; then
            summary_line=$(grep -E '^scanned=' backfill_output.log || true)
            if [ -n "$summary_line" ]; then
              echo "$summary_line"
            else
              echo "No summary line found. Check the previous step's log."
            fi
          else
            echo "Backfill did not run. Check validation/setup steps above."
          fi

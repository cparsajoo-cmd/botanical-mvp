name: Shadow Semantic Gate Stress Test

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-gate-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate OpenAI secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is required."
            exit 1
          fi

      - name: Run local exposed-case stress test
        run: |
          set -euo pipefail
          python shadow_semantic_gate_stress.py | tee semantic_gate_stress.log

      - name: Add compact summary
        if: always()
        run: |
          if [ -f semantic_gate_stress.log ]; then
            grep '^SUMMARY ' semantic_gate_stress.log >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "No stress-test output was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

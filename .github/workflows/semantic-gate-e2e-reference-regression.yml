name: Semantic Gate E2E Reference Regression

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exposed frozen set to run (v3 is smallest: 20 records / 20 OpenAI calls)"
        required: true
        default: "v3"
        type: choice
        options:
          - v3
          - v2

permissions:
  contents: read

jobs:
  semantic-gate-e2e-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Validate OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is missing"; exit 1; }

      - name: Verify frozen v3 integrity
        if: ${{ inputs.tag == 'v3' }}
        run: python verify_rgv3_freeze.py

      - name: Run semantic-gate end-to-end reference regression
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          python semantic_gate_e2e_reference_regression.py --tag "${{ inputs.tag }}" | tee semantic_gate_e2e_reference_regression.log

      - name: Add compact summary
        if: always()
        run: |
          if [ -f semantic_gate_e2e_reference_regression.log ]; then
            grep '^SUMMARY ' semantic_gate_e2e_reference_regression.log >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "No semantic-gate E2E output was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-gate-e2e-reference-regression-${{ inputs.tag }}
          if-no-files-found: ignore
          path: |
            semantic_gate_e2e_reference_regression.log
            semantic_gate_e2e_reference_regression_${{ inputs.tag }}.json

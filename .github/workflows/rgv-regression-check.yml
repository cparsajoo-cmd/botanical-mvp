name: RGV Validation Run

# Manual only. Runs one Reference-Grounded Validation case set: v1, v2, or
# v3 (select via the "tag" input) against whatever engine code is on the
# selected branch.
#
# v1 and v2 are REGRESSION checks, not a fresh/independent validity
# estimate -- those 24 cases each are exposed (the engine has effectively
# "seen" them across prior remediation rounds) and must never be reported
# as an unbiased accuracy number. See run_final_reference_holdout_v1.py
# and the integrity rule in FINAL_REFERENCE_GROUNDED_VALIDATION_V2_REPORT.md.
#
# v3 (added 2026-08-11) is a genuinely independent 20-case BLIND holdout,
# frozen before this workflow was ever run against it -- see
# FREEZE_MANIFEST_v3.json. For tag=v3 only, this workflow runs
# verify_rgv3_freeze.py FIRST and refuses to proceed to the engine run if
# any frozen file's hash no longer matches the manifest, so a v3 result
# can never be reported without first proving the holdout wasn't touched
# after freeze.
#
# See the 2026-08-10 note in run_final_reference_holdout_v1.py for why
# v1/v2/v3 each use separate, versioned label/result filenames (v1 and v2
# used to share one filename and v2's run silently destroyed v1's frozen
# labels).
#
# Needs real network access to Supabase (the engine loads
# evidence_records_df / plant_compounds_df / etc. from the live database
# even when the case's own evidence is injected via a frozen snapshot) and
# to OpenAI (semantic-relevance embeddings), so this cannot run in a
# sandboxed/offline environment -- that's why it's a workflow, not
# something run locally.
"on":
  workflow_dispatch:
    inputs:
      tag:
        description: "Which case set to run: v1/v2 = regression check on exposed cases, v3 = genuine blind holdout"
        required: true
        type: choice
        options:
          - v1
          - v2
          - v3
        default: v2

permissions:
  contents: read

jobs:
  rgv-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing GitHub Actions secret: OPENAI_API_KEY"
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret: SUPABASE_URL"
            exit 1
          fi
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Missing GitHub Actions secret: SUPABASE_KEY"
            exit 1
          fi

      - name: Verify v3 freeze integrity (tag=v3 only)
        if: ${{ inputs.tag == 'v3' }}
        run: |
          set -euo pipefail
          python verify_rgv3_freeze.py || {
            echo "::error::v3 freeze integrity check FAILED -- refusing to run the blind validation. See the log above for which file(s) no longer match FREEZE_MANIFEST_v3.json."
            exit 1
          }

      - name: Run RGV validation (selected case set)
        run: |
          set -euo pipefail
          python run_final_reference_holdout_v1.py --tag "$TAG" > rgv_run_full.log 2>&1 || {
            echo "::error::run_final_reference_holdout_v1.py failed -- see the log below."
            cat rgv_run_full.log
            exit 1
          }

      - name: Print clean summary (metrics + per-case results)
        if: always()
        run: |
          set -euo pipefail
          BASE="gold_corpus/scientific_validity/final_holdout_v1"
          echo "===== tag: $TAG ====="
          echo "===== metrics (blind_results_${TAG}.json) ====="
          python -m json.tool "$BASE/blind_results_${TAG}.json"
          echo
          echo "===== release gate (release_gate_result_${TAG}.json) ====="
          python -m json.tool "$BASE/release_gate_result_${TAG}.json"

      - name: Upload full run log (only shown if something looked wrong above)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rgv-regression-full-log
          path: rgv_run_full.log
          retention-days: 14
